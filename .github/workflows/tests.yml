name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libhdf5-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libcairo2-dev \
            libharfbuzz-dev \
            libfribidi-dev

       - name: Install R dependencies
	 uses: r-lib/actions/setup-r-dependencies@v2
	 with:
	   packages: |
	      deps::.
	      any::testthat
	      any::pkgload
	      any::BiocManager

      - name: Install rhdf5
        run: |
          Rscript -e 'BiocManager::install("rhdf5", ask = FALSE, update = FALSE)'

      - name: Run tests
        run: |
          Rscript -e 'pkgload::load_all("."); testthat::test_dir("tests/testthat")'
